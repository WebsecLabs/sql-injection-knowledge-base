worker_processes auto;
error_log /var/log/nginx/error.log warn;
# Runs as an unprivileged user, so runtime files live under /tmp
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/xml+rss application/rss+xml font/truetype font/opentype image/svg+xml;

    # Hashed build assets never change; the search index changes on rebuild;
    # pages are always revalidated so deploys show up immediately
    map $uri $cache_control {
        ~/_astro/     "public, max-age=31536000, immutable";
        ~/pagefind/   "public, max-age=3600";
        default       "no-cache";
    }

    server {
        listen 80;
        server_name localhost;
        absolute_redirect off; # Fix for Docker port mapping issues
        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;

        # Defines $site_csp: the Content-Security-Policy generated at build time
        # from the site's inline script hashes (see src/plugins/csp-integration.mjs).
        # Pages also embed it as a <meta> tag; the header adds the directives a
        # <meta> policy cannot carry (frame-ancestors and reporting).
        include /etc/nginx/csp-policy.conf;

        # Standalone deployment, served directly: the full header set. A
        # location that sets its own add_header replaces all of these.
        add_header Cache-Control $cache_control always;
        add_header Content-Security-Policy "$site_csp; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        error_page 404 /404.html;

        # Never serve dotfiles from the build output
        location ~ /\. {
            return 404;
        }

        # Integrated mode, behind the websec.ca proxy. The proxy adds HSTS,
        # nosniff, framing, referrer and permissions headers; only caching and
        # the CSP, which is specific to this site's build, are set here.
        # Reporting uses websec.ca's endpoint, matching the main site's policy.
        location = /sql-injection-knowledge-base {
            return 301 /sql-injection-knowledge-base/;
        }

        location /sql-injection-knowledge-base/ {
            alias /usr/share/nginx/html/;
            try_files $uri $uri/ =404;
            error_page 404 /sql-injection-knowledge-base/404.html;
            add_header Cache-Control $cache_control always;
            add_header Content-Security-Policy "$site_csp; frame-ancestors 'none'; report-uri /api/csp-report; report-to csp-endpoint" always;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
