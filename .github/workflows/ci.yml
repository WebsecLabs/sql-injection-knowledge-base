name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR to avoid redundant work
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      # Shipped dependencies must be free of known vulnerabilities at any severity
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      # Dev tooling never reaches the deployed site; fail only on critical advisories
      - name: Audit all dependencies
        run: npm audit --audit-level=critical

      - run: npm run lint

      - run: npm run typecheck

  unit-tests:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - run: npm run test:unit:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build
    needs: [lint, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      # Standalone mode must keep building for forks and local use
      - name: Build (standalone)
        run: npm run build:standalone
        env:
          SITE_URL: https://ci.example.com

      # Integrated mode is what ships to websec.ca; E2E tests run against it
      - name: Build (integrated)
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          # Retain build artifacts for 3 days to allow post-E2E debugging
          retention-days: 3

  e2e:
    name: ${{ matrix.suite.name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: E2E Tests
            args: ""
            report: playwright-report
          - name: Accessibility Tests
            args: accessibility.spec.ts
            report: accessibility-report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # Serve the integrated build through the production nginx image and config
      - name: Start production container
        run: |
          docker build -t sqli-kb .
          docker run -d --name sqli-kb -p 8080:80 sqli-kb

      - name: Run Playwright tests
        timeout-minutes: 10
        run: npx playwright test ${{ matrix.suite.args }}
        env:
          CI: true
          PLAYWRIGHT_WEBSERVER_TIMEOUT: "30000"

      - name: Upload report on failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ${{ matrix.suite.report }}
          path: playwright-report/
          retention-days: 7
